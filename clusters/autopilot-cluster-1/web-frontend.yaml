apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: resilient-compute
spec:
  nodePoolAutoCreation:
    enabled: true  # Remediation: Enable node pool auto-creation
  priorities:
    - machineFamily: c3  # Remediation: Primary high-performance family
      spot: true
    - machineFamily: n4  # Remediation: Fallback family for capacity diversity
      spot: true
    - machineFamily: n2  # Remediation: Fallback family for legacy capacity fallback
      spot: true
    - machineFamily: c3  # Remediation: On-Demand fallback priority as guaranteed capacity floor
      spot: false
  whenUnsatisfiable: ScaleUpAnyway  # Remediation: Change to ScaleUpAnyway to fall back automatically

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      nodeSelector:
        cloud.google.com/compute-class: resilient-compute
      containers:
        - name: nginx
          image: nginx:1.25
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

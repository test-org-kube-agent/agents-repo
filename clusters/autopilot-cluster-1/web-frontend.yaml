apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: resilient-compute
spec:
  priorities:
    - machineFamily: c3
      spot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      nodeSelector:
        cloud.google.com/compute-class: resilient-compute
      containers:
        - name: nginx
          image: nginx:1.25
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

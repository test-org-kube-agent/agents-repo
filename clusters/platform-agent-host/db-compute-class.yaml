apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: db-compute-class
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
    # Remediation: Replace granular machine types with machine families to prevent priority starvation.
    - machineFamily: c3
    - machineFamily: n2
    - machineFamily: e2
  whenUnsatisfiable: DoNotScaleUp

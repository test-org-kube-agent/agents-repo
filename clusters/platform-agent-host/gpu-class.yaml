apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gpu-class
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
  - machineFamily: g2
  # Remediation: Add On-Demand fallback to guarantee availability when Spot/regional capacity is low.
  - machineFamily: g2
    spot: false
  # Note: Specifying just "gpu-class" enables Autopilot to request nvidia-l4 GPUs.
  whenUnsatisfiable: DoNotScaleUp

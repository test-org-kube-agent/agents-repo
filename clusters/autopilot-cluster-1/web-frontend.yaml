apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: resilient-compute
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
    - machineFamily: m2
      spot: true
    - machineFamily: c3  # Remediation: fallback family c3 to prevent m2 stockout Pending state
      spot: true
    - machineFamily: n4  # Remediation: fallback family n4 to prevent m2 stockout Pending state
      spot: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      nodeSelector:
        cloud.google.com/compute-class: resilient-compute
      containers:
        - name: nginx
          image: nginx:1.25
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"

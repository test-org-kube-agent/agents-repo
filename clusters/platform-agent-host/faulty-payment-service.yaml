apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-payment-service
  namespace: stockout-scenarios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faulty-payment-service
  template:
    metadata:
      labels:
        app: faulty-payment-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - us-east4-a
                - us-east4-b  # Remediation: Add us-east4-b zone fallback to mitigate stockouts/quota in us-east4-a
                - us-east4-c  # Remediation: Add us-east4-c zone fallback to mitigate stockouts/quota in us-east4-a
      containers:
      - image: nginx:alpine
        name: web
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
      nodeSelector:
        cloud.google.com/compute-class: faulty-spot-class
